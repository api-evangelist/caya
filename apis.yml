aid: caya
name: Caya
description: >-
  Caya (Caya GmbH, Berlin) is a German intelligent document processing (IDP)
  company whose Document Automation Suite digitizes, classifies, and routes
  business documents end to end. Its core capabilities are Post Scan (physical
  mail intake with OCR and automatic classification), Document Extractions
  (AI-powered structured data extraction), and Document Automations (rule-based
  routing and distribution into downstream systems). Caya connects to 100+ tools
  across accounting, ERP, HR, cloud storage, and e-signature, and hosts data in a
  high-security Frankfurt data center. It is certified and compliant against ISO
  27001, GDPR/DSGVO, DORA, GoBD, and German HGB/AO retention rules, with a public
  Vanta-hosted trust center. Surfaced as an HV Capital portfolio company and
  enriched into the API Evangelist network.
